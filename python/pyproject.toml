[project]
name = "jalapenos-reference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "fabay2@uic.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
jalapenos-reference = "jalapenos_reference:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
